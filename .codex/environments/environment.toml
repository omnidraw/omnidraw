version = 1
name = "vibecanvas"

[setup]
script = '''
# - CODEX_SOURE_TREE_PATH
# - CODEX_WORKTREE_PATH

CAPSULE_SOURCE_PATH="$(dirname "$CODEX_SOURCE_TREE_PATH")/capsule"
CAPSULE_WORKTREE_PATH="$(dirname "$CODEX_WORKTREE_PATH")/capsule"

if [ ! -d "$CAPSULE_SOURCE_PATH" ]; then
  echo "Missing Capsule checkout: $CAPSULE_SOURCE_PATH" >&2
  exit 1
fi

if [ -L "$CAPSULE_WORKTREE_PATH" ]; then
  CAPSULE_LINK_TARGET="$(readlink "$CAPSULE_WORKTREE_PATH")"
