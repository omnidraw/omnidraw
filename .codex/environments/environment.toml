    echo "Unexpected Capsule worktree link: $CAPSULE_WORKTREE_PATH -> $CAPSULE_LINK_TARGET" >&2
    exit 1
  fi
elif [ -e "$CAPSULE_WORKTREE_PATH" ]; then
  echo "Refusing to replace existing Capsule worktree path: $CAPSULE_WORKTREE_PATH" >&2
  exit 1
else
  ln -s "$CAPSULE_SOURCE_PATH" "$CAPSULE_WORKTREE_PATH"
fi

mkdir -p "$CODEX_WORKTREE_PATH/.vibecanvas"
rsync -a \
  --exclude='/organizations/*/resources/.vibecanvas-resource-owner' \
  "$CODEX_SOURCE_TREE_PATH/.vibecanvas/" \
  "$CODEX_WORKTREE_PATH/.vibecanvas/"

cd "$CODEX_WORKTREE_PATH"
bun install

cd "$CODEX_WORKTREE_PATH/packages/sdk"
bun run build
'''
