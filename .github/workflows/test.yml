name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_WORKERS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright@1.61.1 install --with-deps chromium

      - name: Configure Chromium sandbox
        shell: bash
        run: |
          chromium_path="$(bun --cwd apps/backend -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')"
          sandbox_path="$(dirname "$chromium_path")/chrome_sandbox"
          test -f "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          echo "CHROME_DEVEL_SANDBOX=$sandbox_path" >> "$GITHUB_ENV"

      - name: Run final architecture acceptance
        run: bun run test:final-acceptance

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.test.ts
            **/*.snap
          if-no-files-found: ignore
          retention-days: 1
