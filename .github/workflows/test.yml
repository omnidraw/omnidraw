name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_WORKERS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Check lockfile uses published npm
        run: bun run check:published-lockfile

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check dependency deduplication
        run: bun dedupe --check

      - name: Install Playwright Chromium
        run: bunx playwright@1.61.1 install --with-deps chromium

      - name: Configure Chromium sandbox
        shell: bash
        run: |
          chromium_path="$(bun --cwd apps/backend -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')"
          sandbox_path="$(dirname "$chromium_path")/chrome_sandbox"
          test -f "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          echo "CHROME_DEVEL_SANDBOX=$sandbox_path" >> "$GITHUB_ENV"

      - name: Run final architecture acceptance
        run: bun run test:final-acceptance

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.test.ts
            **/*.snap
          if-no-files-found: ignore
          retention-days: 1

  source-release:
    name: Source release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout clean source release with Git LFS
        uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Verify clone and lockfile policy
        shell: bash
        run: |
          anonymous_head="$(GIT_TERMINAL_PROMPT=0 git -c credential.helper= ls-remote https://github.com/omnidraw/omnidraw.git HEAD)"
          test -n "$anonymous_head"
          git lfs fsck
          git check-ignore -q .npmrc
          if git ls-files --error-unmatch .npmrc >/dev/null 2>&1; then
            echo '.npmrc must remain untracked' >&2
            exit 1
          fi
          test ! -e .npmrc
          test ! -e .omnidraw
          bun run check:published-lockfile

      - name: Install from the frozen public lockfile
        run: bun install --frozen-lockfile

      - name: Build the complete source release
        run: bun run build

      - name: Start and probe the already-built application
        run: bun run test:source-release
