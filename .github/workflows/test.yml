name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Turso native encryption support
        run: bun run verify:turso-native-encryption

      - name: Run tests
        run: bun run test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.test.ts
            **/*.snap
          if-no-files-found: ignore
          retention-days: 1

  verify-native-encryption:
    name: Verify native encryption (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Load native addon and verify AEGIS-256 export
        run: bun run verify:turso-native-encryption:host
        env:
          VIBECANVAS_EXPECTED_NATIVE_TARGET: ${{ matrix.target }}

  test-binary:
    runs-on: ubuntu-latest
    needs: [test, verify-native-encryption]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux binary
        run: bun run scripts/build.ts --single

      - name: Test Linux binary
        run: |
          chmod +x dist/vibecanvas-linux-x64/bin/vibecanvas
          bun run scripts/test-binary.ts --port 3339
