name: Release SDK

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. sdk-v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Validate sdk tag, package version, and npm availability
        id: version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$TAG_NAME" != sdk-v* ]]; then
            echo "Invalid SDK release tag: '$TAG_NAME'. Expected format: sdk-vX.Y.Z" >&2
            exit 1
          fi

          TAG_VERSION="${TAG_NAME#sdk-v}"
          SDK_VERSION=$(bun -e 'const pkg = await Bun.file("packages/sdk/package.json").json(); process.stdout.write(pkg.version ?? "")')
          SDK_PRIVATE=$(bun -e 'const pkg = await Bun.file("packages/sdk/package.json").json(); process.stdout.write(String(pkg.private === true))')

          if [ -z "$SDK_VERSION" ]; then
            echo "Failed to read version from packages/sdk/package.json" >&2
            exit 1
          fi

          if [ "$SDK_PRIVATE" = "true" ]; then
            echo "packages/sdk/package.json is private. Remove private:true before publishing @vibecanvas/sdk." >&2
            exit 1
          fi

          if [ "$TAG_VERSION" != "$SDK_VERSION" ]; then
            echo "Version mismatch: tag is '$TAG_NAME' but packages/sdk/package.json is '$SDK_VERSION'." >&2
            exit 1
          fi

          if bun pm view "@vibecanvas/sdk@$SDK_VERSION" version >/dev/null 2>&1; then
            echo "npm package already exists: @vibecanvas/sdk@$SDK_VERSION" >&2
            echo "Refusing to publish. Bump packages/sdk/package.json version or remove the package version from npm first." >&2
            exit 1
          fi

          NPM_TAG="latest"
          if [[ "$SDK_VERSION" == *-* ]]; then
            PRERELEASE="${SDK_VERSION#*-}"
            if [[ "$PRERELEASE" == beta* ]]; then
              NPM_TAG="beta"
            elif [[ "$PRERELEASE" == nightly* ]]; then
              NPM_TAG="nightly"
            else
              NPM_TAG="next"
            fi
          fi

          echo "version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Validated SDK release $TAG_NAME with npm tag $NPM_TAG"

  test-and-build:
    runs-on: ubuntu-latest
    needs:
      - check-version
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-version.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test SDK
        run: bun run --filter @vibecanvas/sdk test

      - name: Build SDK
        run: bun run --filter @vibecanvas/sdk build

      - name: Upload SDK dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: packages/sdk/dist
          if-no-files-found: error
          retention-days: 7

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - check-version
      - test-and-build
    environment:
      name: production
    env:
      GH_TOKEN: ${{ secrets.SDK_RELEASE_GITHUB_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-version.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download SDK dist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/sdk/dist

      - name: Re-check npm availability before publishing
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          if bun pm view "@vibecanvas/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "npm package already exists: @vibecanvas/sdk@$VERSION" >&2
            echo "Refusing to publish. Bump packages/sdk/package.json version or remove the package version from npm first." >&2
            exit 1
          fi

      - name: Publish SDK to npm
        env:
          NPM_TAG: ${{ needs.check-version.outputs.npm_tag }}
        working-directory: packages/sdk
        run: |
          set -euo pipefail
          npm publish --access public --tag "$NPM_TAG" --dry-run
          npm publish --access public --tag "$NPM_TAG" --provenance

      - name: Publish GitHub release
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing SDK_RELEASE_GITHUB_TOKEN secret. It must have contents:write access to vibecanvas/sdk." >&2
            exit 1
          fi
          ARGS=("gh" "release" "create" "$TAG" "--repo" "vibecanvas/sdk" "--title" "$TAG" "--generate-notes")
          if [[ "$VERSION" == *-* ]]; then
            ARGS+=("--prerelease")
          fi
          "${ARGS[@]}"

      - name: Print release summary
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: echo "Published release $TAG"
