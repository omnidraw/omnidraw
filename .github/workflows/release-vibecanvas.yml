name: Release Vibecanvas

on:
  push:
    tags:
      - 'vibecanvas-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. vibecanvas-v0.3.2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_notes: ${{ steps.version.outputs.release_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Validate vibecanvas tag, app version, and npm availability
        id: version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$TAG_NAME" != vibecanvas-v* ]]; then
            echo "Invalid vibecanvas release tag: '$TAG_NAME'. Expected format: vibecanvas-vX.Y.Z" >&2
            exit 1
          fi

          TAG_VERSION="${TAG_NAME#vibecanvas-v}"
          APP_VERSION=$(bun -e 'const pkg = await Bun.file("apps/vibecanvas/package.json").json(); process.stdout.write(pkg.version ?? "")')

          if [ -z "$APP_VERSION" ]; then
            echo "Failed to read version from apps/vibecanvas/package.json" >&2
            exit 1
          fi

          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Version mismatch: tag is '$TAG_NAME' but apps/vibecanvas/package.json is '$APP_VERSION'." >&2
            exit 1
          fi

          PACKAGES=(
            "vibecanvas"
            "vibecanvas-darwin-arm64"
            "vibecanvas-darwin-x64"
            "vibecanvas-linux-arm64"
            "vibecanvas-linux-x64"
            "vibecanvas-linux-x64-baseline"
            "vibecanvas-linux-arm64-musl"
            "vibecanvas-linux-x64-musl"
          )

          for PACKAGE in "${PACKAGES[@]}"; do
            if bun pm view "$PACKAGE@$APP_VERSION" version >/dev/null 2>&1; then
              echo "npm package already exists: $PACKAGE@$APP_VERSION" >&2
              echo "Refusing to publish. Bump apps/vibecanvas/package.json version or remove the package version from npm first." >&2
              exit 1
            fi
          done

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          VERSION="$APP_VERSION" NOTES_FILE="$NOTES_FILE" bun run - <<'EOF'
          const version = process.env.VERSION
          const notesFile = process.env.NOTES_FILE

          if (!version || !notesFile) {
            throw new Error("Missing VERSION or NOTES_FILE environment variable")
          }

          const text = await Bun.file("CHANGELOG.md").text()
          const lines = text.split(/\r?\n/)
          const heading = `## ${version}`
          const start = lines.findIndex((line) => line.trim() === heading)

          if (start === -1) {
            console.error(`Missing release notes in CHANGELOG.md for version ${version}. Expected a section headed exactly: ${heading}`)
            process.exit(1)
          }

          let end = lines.length
          for (let index = start + 1; index < lines.length; index += 1) {
            if (/^##\s+/.test(lines[index])) {
              end = index
              break
            }
          }

          const section = lines.slice(start + 1, end).join("\n").trim()
          if (!section) {
            console.error(`CHANGELOG.md section ${heading} exists but is empty.`)
            process.exit(1)
          }

          await Bun.write(notesFile, `${section}\n`)
          EOF

          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          {
            echo "release_notes<<EOF"
            cat "$NOTES_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Validated vibecanvas release $TAG_NAME"

  test:
    runs-on: ubuntu-latest
    needs:
      - check-version
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-version.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  build-release-artifacts:
    runs-on: ubuntu-latest
    needs:
      - test
      - check-version
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-version.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release artifacts
        run: bun run scripts/build.ts

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  test-linux-binary:
    runs-on: ubuntu-latest
    needs:
      - build-release-artifacts
      - check-version
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-version.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Test Linux x64 binary
        run: |
          chmod +x dist/vibecanvas-linux-x64/bin/vibecanvas
          bun run scripts/test-binary.ts --binary dist/vibecanvas-linux-x64/bin/vibecanvas --port 3339

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - test
      - check-version
      - build-release-artifacts
      - test-linux-binary
    environment:
      name: production
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-version.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Re-check npm availability before publishing
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGES=(
            "vibecanvas"
            "vibecanvas-darwin-arm64"
            "vibecanvas-darwin-x64"
            "vibecanvas-linux-arm64"
            "vibecanvas-linux-x64"
            "vibecanvas-linux-x64-baseline"
            "vibecanvas-linux-arm64-musl"
            "vibecanvas-linux-x64-musl"
          )
          for PACKAGE in "${PACKAGES[@]}"; do
            if bun pm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
              echo "npm package already exists: $PACKAGE@$VERSION" >&2
              echo "Refusing to publish. Bump apps/vibecanvas/package.json version or remove the package version from npm first." >&2
              exit 1
            fi
          done

      - name: Publish npm packages
        run: bun run scripts/publish-npm.ts

      - name: Publish GitHub release
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
          RELEASE_NOTES: ${{ needs.check-version.outputs.release_notes }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$NOTES_FILE"
          bun run scripts/release.ts --tag "$TAG" --notes-file "$NOTES_FILE" --fail-if-exists

      - name: Print release summary
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: echo "Published release $TAG"
